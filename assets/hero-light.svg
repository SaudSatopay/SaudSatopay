<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Saud Satopay — AI/ML engineer"><title>Saud Satopay — AI/ML engineer</title><style>@font-face{font-family:body;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:caps;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:disp;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ital;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:italb;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;src:url(data:font/woff2;base64,) format('woff2')}
