<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" role="img" aria-label="What I build: Retrieval that can't hallucinate. Risk engines that can't miss. Vision where the signal dies. Patches in the plumbing."><title>What I build: Retrieval that can't hallucinate. Risk engines that can't miss. Vision where the signal dies. Patches in the plumbing.</title><style>@font-face{font-family:body;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:disp;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:italb;src:url(data:font/woff2;base64,) format('woff2')}
text{font-kerning:normal}
.rise{animation:rise 1.1s cubic-bezier(.2,.72,.18,1) both}
.fade{animation:fade 1.6s ease both}
.draw{transform-box:fill-box;transform-origin:left;animation:draw 1.5s cubic-bezier(.2,.72,.18,1) both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.72,.18,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><g class="rise" style="animation-delay:0.10s"><text x="0.0" y="46.0" font-family="italb" font-size="34" fill="#ff4e1f">I</text><line x1="0.0" y1="64" x2="204.0" y2="64" stroke="#443c28" stroke-width="1"/><text x="0.0" y="96.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">Retrieval that can't</text><text x="0.0" y="121.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">hallucinate.</text><text x="0.0" y="154.0" font-family="body" font-size="13" fill="#b5aa8c">Dense + sparse search,</text><text x="0.0" y="174.0" font-family="body" font-size="13" fill="#b5aa8c">cross-encoder rerank, hard</text><text x="0.0" y="194.0" font-family="body" font-size="13" fill="#b5aa8c">whitelist guards. If it isn't in the</text><text x="0.0" y="214.0" font-family="body" font-size="13" fill="#b5aa8c">corpus, it isn't in the answer.</text></g><g class="rise" style="animation-delay:0.22s"><text x="232.0" y="46.0" font-family="italb" font-size="34" fill="#ff4e1f">II</text><line x1="232.0" y1="64" x2="436.0" y2="64" stroke="#443c28" stroke-width="1"/><text x="232.0" y="96.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">Risk engines that can't</text><text x="232.0" y="121.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">miss.</text><text x="232.0" y="154.0" font-family="body" font-size="13" fill="#b5aa8c">A deterministic core makes the call;</text><text x="232.0" y="174.0" font-family="body" font-size="13" fill="#b5aa8c">LLM agents only explain it.</text><text x="232.0" y="194.0" font-family="body" font-size="13" fill="#b5aa8c">Replayed against real disasters,</text><text x="232.0" y="214.0" font-family="body" font-size="13" fill="#b5aa8c">timed in microseconds.</text></g><g class="rise" style="animation-delay:0.34s"><text x="464.0" y="46.0" font-family="italb" font-size="34" fill="#ff4e1f">III</text><line x1="464.0" y1="64" x2="668.0" y2="64" stroke="#443c28" stroke-width="1"/><text x="464.0" y="96.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">Vision where the</text><text x="464.0" y="121.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">signal dies.</text><text x="464.0" y="154.0" font-family="body" font-size="13" fill="#b5aa8c">TFLite, MobileFaceNet and</text><text x="464.0" y="174.0" font-family="body" font-size="13" fill="#b5aa8c">YOLOv8 running fully on-device —</text><text x="464.0" y="194.0" font-family="body" font-size="13" fill="#b5aa8c">for sites with zero connectivity and</text><text x="464.0" y="214.0" font-family="body" font-size="13" fill="#b5aa8c">no second chances.</text></g><g class="rise" style="animation-delay:0.46s"><text x="696.0" y="46.0" font-family="italb" font-size="34" fill="#ff4e1f">IV</text><line x1="696.0" y1="64" x2="900.0" y2="64" stroke="#443c28" stroke-width="1"/><text x="696.0" y="96.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">Patches in the</text><text x="696.0" y="121.0" font-family="disp" font-size="21" fill="#f1e6cd" letter-spacing="-0.2">plumbing.</text><text x="696.0" y="154.0" font-family="body" font-size="13" fill="#b5aa8c">Memory-safety fixes merged into</text><text x="696.0" y="174.0" font-family="body" font-size="13" fill="#b5aa8c">libheif and assimp — C/C++ that</text><text x="696.0" y="194.0" font-family="body" font-size="13" fill="#b5aa8c">ships inside browsers, games and</text><text x="696.0" y="214.0" font-family="body" font-size="13" fill="#b5aa8c">image pipelines.</text></g></svg>