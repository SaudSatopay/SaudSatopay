<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 118" width="900" height="118" role="img" aria-label="By the  numbers"><title>By the  numbers</title><style>@font-face{font-family:disp;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ital;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;src:url(data:font/woff2;base64,) format('woff2')}
text{font-kerning:normal}
.rise{animation:rise 1.1s cubic-bezier(.2,.72,.18,1) both}
.fade{animation:fade 1.6s ease both}
.draw{transform-box:fill-box;transform-origin:left;animation:draw 1.5s cubic-bezier(.2,.72,.18,1) both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.72,.18,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs><line x1="0" y1="20" x2="900" y2="20" stroke="#16120a" stroke-width="2.2" class="draw"/><line x1="0" y1="26" x2="900" y2="26" stroke="#16120a" stroke-width="0.7" class="draw" style="animation-delay:.08s"/><text x="0.0" y="92.0" font-family="mono" font-size="13" fill="#e2401a" letter-spacing="1.5" class="fade" style="animation-delay:.2s">§ VI</text><g class="rise" style="animation-delay:.1s"><text x="72.0" y="96.0" font-family="ital" font-size="50" fill="#16120a">By the </text><text x="187.1" y="96.0" font-family="disp" font-size="50" fill="#16120a">numbers</text></g><text x="900.0" y="92.0" font-family="mono" font-size="10.5" fill="#857a5c" text-anchor="end" letter-spacing="2" class="fade" style="animation-delay:.35s">LIVE FROM THE GITHUB API</text></svg>