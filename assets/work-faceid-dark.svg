tion-delay:.6s">LFW ACCURACY</text><text x="180.5" y="278.0" font-family="body" font-size="12.5" fill="#b5aa8c" class="fade" style="animation-delay:.65s">~13 ms per inference, on-device</text><text x="28.0" y="312.0" font-family="mono" font-size="10" fill="#867c64" class="fade" style="animation-delay:.7s">React Native · TFLite · MobileFaceNet</text></svg>