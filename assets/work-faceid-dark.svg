<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-label="Offline Face ID — Face recognition and liveness detection that runs entirely on the phone, for remote sites with zero connectivity. Syncs when a signal returns."><title>Offline Face ID — Face recognition and liveness detection that runs entirely on the phone, for remote sites with zero connectivity. Syncs when a signal returns.</title><style>@font-face{font-family:body;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:caps;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:disp;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:italb;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;src:url(data:font/woff2;base64,) format('woff2')}
