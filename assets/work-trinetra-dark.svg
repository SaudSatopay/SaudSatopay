<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-label="trinetra — Fuses gas sensors, hot-work permits and CCTV into one deterministic risk score. LangGraph agents explain the call — they never make it."><title>trinetra — Fuses gas sensors, hot-work permits and CCTV into one deterministic risk score. LangGraph agents explain the call — they never make it.</title><style>@font-face{font-family:body;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:caps;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:disp;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:italb;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:mono;src:url(data:font/woff2;base64,) format('woff2')}
text{font-kerning:normal}
.rise{animation:rise 1.1s cubic-bezier(.2,.72,.18,1) both}
.fade{animation:fade 1.6s ease both}
.draw{transform-box:fill-box;transform-origin:left;animation:draw 1.5s cubic-bezier(.2,.72,.18,1) both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.72,.18,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="440" height="330" rx="0" fill="#17140d"/><rect width="440" height="330" rx="0" filter="url(#grain)" opacity="0.07"/><rect x=".5" y=".5" width="439" height="329" fill="none" stroke="#443c28"/><text x="28.0" y="44.0" font-family="mono" font-size="12" fill="#ff4e1f" letter-spacing="1">01</text><text x="412.0" y="44.0" font-family="mono" font-size="9.5" fill="#867c64" text-anchor="end" letter-spacing="1.6">INDUSTRIAL SAFETY · RISK ENGINE</text><line x1="28" y1="58" x2="412" y2="58" stroke="#443c28" stroke-width="1" class="draw" style="animation-delay:.2s"/><text x="27.0" y="106.0" font-family="disp" font-size="40" fill="#f1e6cd" letter-spacing="-0.6" class="rise" style="animation-delay:.1s">trinetra</text><text x="412.0" y="104.0" font-family="mono" font-size="20" fill="#ff4e1f" text-anchor="end" class="fade" style="animation-delay:.5s">↗</text><text x="28.0" y="138.0" font-family="body" font-size="13.5" fill="#b5aa8c" class="rise" style="animation-delay:0.20s">Fuses gas sensors, hot-work permits and CCTV into one</text><text x="28.0" y="159.0" font-family="body" font-size="13.5" fill="#b5aa8c" class="rise" style="animation-delay:0.26s">deterministic risk score. LangGraph agents explain the call —</text><text x="28.0" y="180.0" font-family="body" font-size="13.5" fill="#b5aa8c" class="rise" style="animation-delay:0.32s">they never make it.</text><line x1="28" y1="222" x2="412" y2="222" stroke="#2b2618" stroke-width="1"/><text x="27.0" y="282.0" font-family="italb" font-size="54" fill="#ff4e1f" class="rise" style="animation-delay:.45s">~50µs</text><text x="187.3" y="258.0" font-family="caps" font-size="10" fill="#f1e6cd" letter-spacing="2" class="fade" style="animation-delay:.6s">P50 DECISION</text><text x="187.3" y="278.0" font-family="body" font-size="12.5" fill="#b5aa8c" class="fade" style="animation-delay:.65s">100% recall · 240 unseen scenarios</text><text x="28.0" y="312.0" font-family="mono" font-size="10" fill="#867c64" class="fade" style="animation-delay:.7s">Python · FastAPI · LangGraph · NetworkX · YOLOv8</text></svg>